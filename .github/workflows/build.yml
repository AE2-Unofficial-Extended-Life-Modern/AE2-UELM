name: 'Build and Test'

on:
  push:
    # Only on branches, not tags/releases
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

# Cancel outdated builds for the same branch
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run the pull-request build if the pull-request was opened from another repository,
    # since we already run this workflow for the branch the pull request was made from.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - run: git fetch origin --tags
        shell: bash
      - uses: ./.github/actions/gradle-setup
      - name: Generate assets
        run: ./gradlew runData
      - name: Check that datagen ran
        run: test -d ./src/generated/resources/.cache
      - name: Make sure that generated files in the repo are up-to-date
        run: |
          # Print status for easier debugging
          git status
          if [ -n "$(git status --porcelain)" ]; then exit 1; fi
      # Derive the build version from the latest non-prerelease neoforge release,
      # e.g. neoforge/v19.2.18-uelm -> 19.2.18-uelm-dev.<sha> / 19.2.18-uelm-pr.<n>.<sha>
      # Only neoforge tags count: forge/v... releases belong to the 1.20.1 line.
      - name: Resolve build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '[.[].tagName | select(startswith("neoforge/v"))][0] // ""')
          base=${tag#neoforge/v}
          base=${base:-0.0.0}
          short=${SHA::7}
          if [ -n "$PR" ]; then
            version="${base}-pr.${PR}.${short}"
          else
            version="${base}-dev.${short}"
          fi
          echo "Building version $version (from release tag '${tag:-none}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew printProjectVersion build -Pversion=${{ steps.version.outputs.version }} --max-workers 1

      - name: Run Game Tests
        run: ./gradlew runGametest

      # Always upload test results
      - name: Merge Test Reports
        if: success() || failure()
        run: npx junit-report-merger junit.xml "**/TEST-*.xml"

      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: test-results
          path: junit.xml

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/libs/
