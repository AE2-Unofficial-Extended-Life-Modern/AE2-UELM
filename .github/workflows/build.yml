name: 'Build and Test'

on:
  push:
  pull_request:
    branches:
      - '**'

# Cancel outdated builds for the same branch
concurrency:
  group: ci-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Only run the pull-request build if the pull-request was opened from another repository,
    # since we already run this workflow for the branch the pull request was made from.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: AE2-Unofficial-Extended-Life-Modern/AE2-UELM/.github/actions/gradle-setup@forge/1.20.1
      - name: Generate assets
        run: ./gradlew runData
      - name: Check that datagen ran
        run: test -d ./src/generated/resources/.cache
      - name: Make sure that datagenned files in the repo are up-to-date
        run: |
          # Print status for easier debugging
          git status
          if [ -n "$(git status --porcelain)" ]; then exit 1; fi
      # Derive the build version from the latest (non-prerelease) GitHub release,
      # e.g. forge/v15.5.5-uelm -> 15.5.5-uelm-dev.<sha> / 15.5.5-uelm-pr.<n>.<sha>
      - name: Resolve build version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          base=${tag#forge/v}
          base=${base:-0.0.0}
          short=${SHA::7}
          if [ -n "$PR" ]; then
            version="${base}-pr.${PR}.${short}"
          else
            version="${base}-dev.${short}"
          fi
          echo "Building version $version (from release tag '${tag:-none}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build with Gradle
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }}
      #- name: Run Game Tests
      #  run: ./gradlew runGametest
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: build/libs/
