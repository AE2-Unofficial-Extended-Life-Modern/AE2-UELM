name: Spotless Apply

on:
  workflow_dispatch:
    inputs:
      base:
        description: 'Base branch for the PR (default: repository default branch)'
        required: false
        default: ''
      required_checks:
        description: 'Comma-separated required check names to wait for (e.g., build). Leave empty to wait for overall success.'
        required: false
        default: 'build'
      max_wait_minutes:
        description: 'Max minutes to wait for checks to pass'
        required: false
        default: '30'
      poll_interval_seconds:
        description: 'Seconds between polling attempts'
        required: false
        default: '30'
      merge_method:
        description: 'Merge method: merge, squash, or rebase'
        required: false
        default: 'merge'

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: 'spotless-apply'
  cancel-in-progress: true

jobs:
  spotless:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      - name: Run Spotless Apply
        run: ./gradlew spotlessApply --no-daemon

      - name: Check for git changes
        id: changes
        run: |
          CHANGES=$(git status --porcelain)
          echo "changes<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create branch and push formatting changes
        if: steps.changes.outputs.changes != ''
        id: push_branch
        run: |
          set -e
          BRANCH="spotless/apply-$(date +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "Apply Spotless formatting" || echo "No changes to commit"
          git push --set-upstream origin "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Create PR, wait for checks, and auto-merge
        if: steps.changes.outputs.changes != ''
        uses: actions/github-script@v7
        env:
          BASE_INPUT: ${{ github.event.inputs.base }}
          REQUIRED_CHECKS: ${{ github.event.inputs.required_checks }}
          MAX_WAIT_MINUTES: ${{ github.event.inputs.max_wait_minutes }}
          POLL_INTERVAL_SECONDS: ${{ github.event.inputs.poll_interval_seconds }}
          MERGE_METHOD: ${{ github.event.inputs.merge_method }}
          BRANCH: ${{ env.BRANCH }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Determine base branch
            let base = process.env.BASE_INPUT;
            if (!base || base.trim() === '') {
              const { data: repository } = await github.rest.repos.get({ owner, repo });
              base = repository.default_branch;
            }

            const head = process.env.BRANCH;
            if (!head) {
              core.setFailed('Branch name not found in environment (BRANCH). Aborting.');
              return;
            }

            const title = 'Apply Spotless formatting';
            const body = 'Automatically generated PR to apply Spotless formatting. CI must pass before merging due to branch protection.';

            // Create Pull Request
            const { data: pr } = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body
            });

            core.info(`Created PR #${pr.number}: ${pr.html_url}`);
            const headSha = pr.head.sha;

            // Poll for check success
            const required = (process.env.REQUIRED_CHECKS || '').split(',').map(s => s.trim()).filter(Boolean);
            const maxWaitMinutes = parseInt(process.env.MAX_WAIT_MINUTES || '30', 10);
            const pollSec = parseInt(process.env.POLL_INTERVAL_SECONDS || '30', 10);
            const maxAttempts = Math.ceil((maxWaitMinutes * 60) / Math.max(pollSec, 1));

            let passed = false;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
              core.info(`Polling attempt ${attempt + 1}/${maxAttempts} for checks (ref: ${headSha})`);

              // Combined status (legacy statuses)
              const combined = await github.rest.repos.getCombinedStatusForRef({
                owner, repo, ref: headSha
              });

              // Modern checks API
              const checks = await github.rest.checks.listForRef({
                owner, repo, ref: headSha
              });

              core.info(`Combined state: ${combined.data.state}; ${checks.data.check_runs.length} check_runs found.`);

              if (required.length === 0) {
                // Wait for overall success
                if (combined.data.state === 'success') {
                  passed = true;
                  break;
                }
              } else {
                // Ensure each required check is present and successful either in check_runs or in combined statuses
                const statusMap = new Map(combined.data.statuses.map(s => [s.context, s.state]));
                const checkRunMap = new Map(checks.data.check_runs.map(c => [c.name, c.conclusion]));

                let allOk = true;
                for (const req of required) {
                  const cr = checkRunMap.get(req);
                  const st = statusMap.get(req);
                  if ((cr && cr === 'success') || (st && st === 'success')) {
                    continue;
                  } else {
                    allOk = false;
                    break;
                  }
                }
                if (allOk) {
                  passed = true;
                  break;
                }
              }

              // If some checks have finished with failure, bail out early
              if (combined.data.state === 'failure') {
                core.info('Combined state indicates failure; will continue polling until timeout to collect final results.');
              }

              await new Promise(resolve => setTimeout(resolve, pollSec * 1000));
            }

            if (!passed) {
              core.setFailed(`Checks did not pass within ${maxWaitMinutes} minutes for PR #${pr.number}. Leave the PR for manual review.`);
              return;
            }

            // Attempt to merge
            try {
              const mergeResult = await github.rest.pulls.merge({
                owner,
                repo,
                pull_number: pr.number,
                merge_method: process.env.MERGE_METHOD || 'merge'
              });

              if (mergeResult.data.merged) {
                core.info(`PR #${pr.number} merged successfully (${mergeResult.data.sha}).`);
                return { pr_url: pr.html_url, merged: true, sha: mergeResult.data.sha };
              } else {
                core.setFailed(`PR #${pr.number} could not be merged automatically. Reason: ${mergeResult.data.message}`);
                return { pr_url: pr.html_url, merged: false, message: mergeResult.data.message };
              }
            } catch (err) {
              core.setFailed(`Merge attempt failed for PR #${pr.number}: ${err.message}`);
            }
